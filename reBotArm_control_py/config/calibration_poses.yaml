# 单位: rad。approach_delta: 双向接近中转偏移，用于程序 2 消 Coulomb 摩擦。
# 由 scripts/gen_calib_poses.py 自动生成：joint1 固定不动；joint2 角度均匀分档；
# 所有位姿及双向接近点均通过限位+自碰撞+地面干涉检查。
# 位姿数 40 → 静止采样点约 80 个。

