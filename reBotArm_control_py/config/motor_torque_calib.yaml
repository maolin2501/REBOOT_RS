# 电机扭矩标定：把电机反馈/设定扭矩修正为实际输出扭矩。
#
# 模型: tau_actual = gain * tau_feedback + offset * sign(tau_feedback)
#   - 标定侧用于把测得力矩还原为真实重力
#   - 输出侧用其逆变换 cmd = sign(g)*max(0,|g|-offset)/gain
#
# RS06（joint1-3）台架数据（示波器设定 set -> 实际转矩）：
#   set   = [2,   4,   6,   8,    10,   11]
#   50rpm = [2.4, 4.8, 7,   9,    10.9, 11.8]   # 当前采用
#   堵转  = [2.1, 4.7, 7.3, 9.5,  11.2, 12.3]
#   50rpm 仿射拟合 actual = 1.0381*set + 0.5564  (R^2 = 0.998)
#
# RS00（joint4-6）暂无台架数据，按恒等(不修正)处理，待补测后更新。

models:
  rs-06:
    gain: 1.1219
    offset: 0.1836
  rs-00:
    gain: 1.0
    offset: 0.0
